scalar ObjectId

type Query {
  tenants: [TenantAccess!]!
  activeTenant: TenantSummary
}

type TenantAccess {
  role: UserRole!
  tenant: TenantSummary!
}

enum UserRole {
  superadmin
  admin
  member
}

type TenantSummary {
  id: ObjectId!
  name: String!
  timezone: String!
  currency: String!
}
