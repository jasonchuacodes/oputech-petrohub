scalar ObjectId

type Query {
  viewer: Viewer!
  tenants: [ViewerTenant!]!
  activeTenant: TenantSummary
}

type Viewer {
  id: ObjectId!
  displayName: String!
  username: String!
  status: String!
  role: UserRole!
  accountHolderId: ObjectId
  tenantIds: [ObjectId!]!
  currentTenantId: ObjectId
  tenantSelectionVersion: Int!
  shouldChangePassword: Boolean!
}

type ViewerTenant {
  role: UserRole!
  tenant: TenantSummary!
}

enum UserRole {
  superadmin
  admin
  member
}

type TenantSummary {
  id: ObjectId!
  name: String!
  timezone: String!
  currency: String!
}
