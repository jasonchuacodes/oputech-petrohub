scalar ObjectId

type Query {
  tenants: [TenantAccess!]!
  activeTenant: TenantSummary
}

type Mutation {
  createTenant(input: CreateTenantInput!): TenantSummary!
  updateTenant(input: UpdateTenantInput!): TenantSummary!
  deleteTenant(input: DeleteTenantInput!): Boolean!
}

input CreateTenantInput {
  name: String!
}

input UpdateTenantInput {
  tenantId: ObjectId!
  name: String!
}

input DeleteTenantInput {
  tenantId: ObjectId!
}

type TenantAccess {
  role: UserRole!
  tenant: TenantSummary!
}

enum UserRole {
  superadmin
  admin
  member
}

type TenantSummary {
  id: ObjectId!
  name: String!
  timezone: String!
  currency: String!
}
