extend type Query {
  reportCreationContext: ReportCreationContext!
  report(input: ReportInput!): Report!
  reports(input: ReportsInput!): ReportPage!
}

extend type Mutation {
  createReport(input: CreateReportInput!): CreateReportPayload!
  saveReportDraft(input: SaveReportDraftInput!): Report!
  submitReport(input: ReportTransitionInput!): Report!
  deleteReport(input: DeleteReportInput!): Report!
}

input CreateReportInput {
  shiftId: ObjectId!
  businessDate: String!
}

input ReportInput {
  reportId: ObjectId!
}

input ReportsInput {
  offset: Int = 0
  limit: Int = 20
}

input FinancialEntryInput {
  id: String!
  description: String!
  notes: String
  amount: Decimal!
}

input SaveReportDraftInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
  incomeEntries: [FinancialEntryInput!]!
  expenseEntries: [FinancialEntryInput!]!
  disposalReadings: [EditableDisposalInput!]!
}

input ReportTransitionInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
}

input DeleteReportInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
  reason: String!
}

type CreateReportPayload {
  report: Report!
  created: Boolean!
}

type ReportCreationContext {
  businessDate: String!
  slots: [ReportSlot!]!
}

type ReportSlot {
  shift: Shift!
  report: Report
  canCreate: Boolean!
  blockedReason: String
}

type ReportPage {
  items: [Report!]!
  totalCount: Int!
}

type Report {
  id: ObjectId!
  businessDate: String!
  shiftId: ObjectId!
  interval: ReportIntervalSnapshot!
  currency: String!
  legacy: Boolean!
  effective: Boolean!
  incomeEntries: [FinancialEntry!]!
  expenseEntries: [FinancialEntry!]!
  totals: ReportTotals!
  disposals: DisposalBatch
  creatorId: ObjectId!
  creatorName: String!
  status: ReportStatus!
  revision: Int!
  createdAt: String!
  updatedAt: String!
  submittedAt: String
  submittedById: ObjectId
  submittedByName: String
  revokedFromStatus: ReportStatus
  revokedAt: String
  revokedById: ObjectId
  revokedByName: String
  revocationReason: String
}

type FinancialEntry {
  id: String!
  recurringIncomeFieldId: ObjectId
  description: String!
  notes: String
  amount: Decimal!
}

type ReportTotals {
  income: Decimal!
  expenses: Decimal!
  cashFuelSales: Decimal!
  pumpSales: Decimal
  overShort: Decimal
}

type ReportIntervalSnapshot {
  startTime: String!
  endTime: String!
  timezone: String!
}

enum ReportStatus {
  draft
  submitted
  revoked
}
