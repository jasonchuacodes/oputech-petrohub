extend type Query {
  reportCreationContext: ReportCreationContext!
  report(input: ReportInput!): Report!
  reports(input: ReportsInput!): ReportPage!
  financialSummary(input: FinancialSummaryInput!): FinancialSummary!
}

extend type Mutation {
  createReport(input: CreateReportInput!): CreateReportPayload!
  saveReportDraft(input: SaveReportDraftInput!): Report!
  submitReport(input: ReportTransitionInput!): Report!
  deleteReport(input: DeleteReportInput!): Report!
}

input CreateReportInput {
  slotId: String!
  businessDate: String!
}

input ReportInput {
  reportId: ObjectId!
}

input ReportsInput {
  startDate: String
  endDate: String
  submittedOnly: Boolean = false
  offset: Int = 0
  limit: Int = 20
}

input FinancialSummaryInput {
  startDate: String!
  endDate: String!
}

input FinancialEntryInput {
  id: String!
  description: String!
  notes: String
  amount: Decimal!
}

input SaveReportDraftInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
  incomeEntries: [FinancialEntryInput!]!
  expenseEntries: [FinancialEntryInput!]!
  lubricantSales: [LubricantSaleInput!]
  disposalReadings: [EditableDisposalInput!]!
}

input LubricantSaleInput {
  id: String!
  productId: ObjectId!
  quantity: Decimal!
}

input ReportTransitionInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
}

input DeleteReportInput {
  reportId: ObjectId!
  expectedReportRevision: Int!
  expectedDisposalRevision: Int!
  reason: String!
}

type CreateReportPayload {
  report: Report!
  created: Boolean!
}

type ReportCreationContext {
  businessDate: String!
  slots: [ReportSlot!]!
}

type ReportSlot {
  id: String!
  shift: Shift!
  interval: ReportIntervalSnapshot!
  report: Report
  canCreate: Boolean!
  blockedReason: String
}

type ReportPage {
  items: [Report!]!
  totalCount: Int!
}

enum FinancialBucketInterval {
  day
  week
  month
}

type FinancialSummary {
  startDate: String!
  endDate: String!
  timezone: String!
  currency: String!
  bucketInterval: FinancialBucketInterval!
  includedReportCount: Int!
  totals: FinancialAmounts!
  buckets: [FinancialBucket!]!
}

type FinancialAmounts {
  income: Decimal!
  expenses: Decimal!
  lubricantSales: Decimal!
}

type FinancialBucket {
  startDate: String!
  endDate: String!
  amounts: FinancialAmounts!
}

type Report {
  id: ObjectId!
  businessDate: String!
  shiftId: ObjectId!
  shiftName: String!
  interval: ReportIntervalSnapshot!
  currency: String!
  legacy: Boolean!
  effective: Boolean!
  stale: Boolean!
  incomeEntries: [FinancialEntry!]!
  expenseEntries: [FinancialEntry!]!
  lubricantSales: [LubricantSale!]!
  totals: ReportTotals!
  disposals: DisposalBatch
  creatorId: ObjectId!
  creatorName: String!
  status: ReportStatus!
  revision: Int!
  createdAt: String!
  updatedAt: String!
  submittedAt: String
  submittedById: ObjectId
  submittedByName: String
  revokedFromStatus: ReportStatus
  revokedAt: String
  revokedById: ObjectId
  revokedByName: String
  revocationReason: String
}

type LubricantSale {
  id: String!
  productId: ObjectId!
  productName: String!
  unit: String!
  quantity: Decimal!
  unitPrice: Decimal!
  amount: Decimal!
}

type FinancialEntry {
  id: String!
  recurringIncomeFieldId: ObjectId
  description: String!
  notes: String
  amount: Decimal!
}

type ReportTotals {
  income: Decimal!
  expenses: Decimal!
  cashFuelSales: Decimal!
  pumpSales: Decimal
  overShort: Decimal
  lubricantSales: Decimal!
}

type ReportIntervalSnapshot {
  startTime: String!
  endTime: String!
  timezone: String!
  startAt: String!
  endAt: String!
}

enum ReportStatus {
  draft
  submitted
  revoked
}
