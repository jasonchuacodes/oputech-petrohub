extend type Query {
  users(input: UsersInput!): UserPage!
}

extend type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(input: UpdateUserInput!): User!
  deactivateUser(input: DeactivateUserInput!): User!
  resetUserPassword(input: ResetUserPasswordInput!): User!
  updateMyProfile(input: UpdateMyProfileInput!): User!
  deleteUser(input: DeleteUserInput!): Boolean! @deprecated(reason: "Use deactivateUser")
}

input UsersInput {
  offset: Int = 0
  limit: Int = 20
  availability: TenantUserAvailability = active
}

input CreateUserInput {
  username: String!
  password: String!
  role: UserRole = member
}

input UpdateMyProfileInput {
  firstName: String
  lastName: String
}

input UpdateUserInput {
  userId: ObjectId!
  username: String!
  firstName: String
  lastName: String
  role: UserRole!
}

input DeleteUserInput {
  userId: ObjectId!
}

input DeactivateUserInput {
  userId: ObjectId!
  reason: UserDeactivationReason!
  details: String
  effectiveDate: String!
}

input ResetUserPasswordInput {
  userId: ObjectId!
  newPassword: String!
}

type UserPage {
  items: [User!]!
  totalCount: Int!
  asOf: String!
  nextTransitionAt: String
}

type User {
  id: ObjectId!
  firstName: String
  lastName: String
  fullName: String!
  username: String!
  role: UserRole!
  status: UserStatus!
  tenantMembership: UserTenantMembership
}

type UserTenantMembership {
  tenantId: ObjectId!
  availability: TenantUserAvailability!
  deactivation: UserTenantDeactivation
}

type UserTenantDeactivation {
  reason: UserDeactivationReason!
  details: String
  effectiveDate: String!
  timezone: String!
  effectiveAt: String!
  recordedAt: String!
  recordedById: ObjectId!
  recordedByName: String!
}

enum TenantUserAvailability {
  active
  inactive
}

enum UserDeactivationReason {
  resign
  terminated
  other
}

enum UserStatus {
  active
  disabled
}
