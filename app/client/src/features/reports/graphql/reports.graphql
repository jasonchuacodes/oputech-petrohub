fragment ReportFields on Report {
  id
  businessDate
  shiftId
  shiftName
  interval { startTime endTime timezone startAt endAt }
  creatorId
  creatorName
  status
  revision
  stale
  createdAt
  updatedAt
  submittedAt
  submittedById
  submittedByName
  revokedAt
  revokedByName
  revocationReason
}

fragment ReportDetailFields on Report {
  ...ReportFields
  currency
  legacy
  effective
  revokedFromStatus
  revokedById
  remarks
  incomeEntries { id recurringIncomeFieldId description notes amount }
  expenseEntries { id recurringIncomeFieldId description notes amount }
  lubricantSales { id productId productName unit quantity unitPrice amount }
  totals { income expenses cashFuelSales pumpSales overShort lubricantSales }
  disposals {
    id
    revision
    status
    predecessorBatchId
    successorBatchId
    pumpSales
    complete
    blockingIssues
    readings {
      meterId
      meterLabel
      productId
      productName
      unitPrice
      openingReading
      openingSource
      closingReading
      calibration
      netVolume
      sales
    }
  }
}

query ReportCreationContext {
  reportCreationContext {
    businessDate
    slots {
      id
      canCreate
      blockedReason
      shift { id name startTime endTime }
      interval { startTime endTime timezone startAt endAt }
      report { ...ReportFields }
    }
  }
}

query Reports($input: ReportsInput!) {
  reports(input: $input) {
    items {
      ...ReportFields
      currency
      effective
      totals { income expenses cashFuelSales pumpSales overShort lubricantSales }
    }
    totalCount
  }
}

query FinancialSummary($input: FinancialSummaryInput!) {
  financialSummary(input: $input) {
    startDate
    endDate
    timezone
    currency
    bucketInterval
    includedReportCount
    totals { income expenses lubricantSales }
    buckets {
      startDate
      endDate
      amounts { income expenses lubricantSales }
    }
  }
}

query Report($input: ReportInput!) {
  report(input: $input) { ...ReportDetailFields }
}

mutation CreateReport($input: CreateReportInput!) {
  createReport(input: $input) {
    created
    report { ...ReportDetailFields }
  }
}

mutation SaveReportDraft($input: SaveReportDraftInput!) {
  saveReportDraft(input: $input) { ...ReportDetailFields }
}

mutation UpdateReportRemarks($input: UpdateReportRemarksInput!) {
  updateReportRemarks(input: $input) { ...ReportDetailFields }
}

mutation SubmitReport($input: ReportTransitionInput!) {
  submitReport(input: $input) { ...ReportDetailFields }
}

mutation DeleteReport($input: DeleteReportInput!) {
  deleteReport(input: $input) { ...ReportDetailFields }
}
