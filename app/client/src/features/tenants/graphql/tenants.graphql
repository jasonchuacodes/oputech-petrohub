query Tenants {
  tenants {
    role
    tenant {
      id
      name
      timezone
      currency
    }
  }
}

mutation CreateTenant($input: CreateTenantInput!) {
  createTenant(input: $input) {
    id
    name
    timezone
    currency
  }
}

mutation UpdateTenant($input: UpdateTenantInput!) {
  updateTenant(input: $input) {
    id
    name
    timezone
    currency
  }
}

mutation DeleteTenant($input: DeleteTenantInput!) {
  deleteTenant(input: $input)
}

query Shifts {
  shifts {
    id
    startTime
    endTime
  }
}

mutation CreateShift($input: CreateShiftInput!) {
  createShift(input: $input) {
    id
    startTime
    endTime
  }
}

mutation UpdateShift($input: UpdateShiftInput!) {
  updateShift(input: $input) {
    id
    startTime
    endTime
  }
}

mutation DeleteShift($input: DeleteShiftInput!) {
  deleteShift(input: $input)
}

query RecurringIncomeConfiguration {
  recurringIncomeConfiguration {
    revision
    fields {
      id
      description
      active
    }
  }
}

mutation UpdateRecurringIncomeConfiguration($input: UpdateRecurringIncomeConfigurationInput!) {
  updateRecurringIncomeConfiguration(input: $input) {
    revision
    fields {
      id
      description
      active
    }
  }
}
