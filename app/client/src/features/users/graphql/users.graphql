query Users($input: UsersInput!) {
  users(input: $input) {
    items {
      id
      firstName
      lastName
      fullName
      username
      role
      status
      tenantMembership {
        availability
        deactivation {
          reason
          details
          effectiveDate
          timezone
          effectiveAt
          recordedAt
          recordedByName
        }
      }
    }
    totalCount
    asOf
    nextTransitionAt
  }
}

query UserDetails($input: UserDetailsInput!) {
  userDetails(input: $input) {
    id
    firstName
    lastName
    fullName
    username
    role
    status
    tenantMembership {
      availability
      deactivation {
        reason
        details
        effectiveDate
        timezone
        effectiveAt
        recordedAt
        recordedByName
      }
    }
    sss
    pagibig
    philhealth
    tin
    birthday
    address
  }
}

mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    firstName
    lastName
    fullName
    username
    role
    status
  }
}

mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    id
    firstName
    lastName
    fullName
    username
    role
    status
  }
}

mutation ResetUserPassword($input: ResetUserPasswordInput!) {
  resetUserPassword(input: $input) {
    id
    username
  }
}

mutation DeactivateUser($input: DeactivateUserInput!) {
  deactivateUser(input: $input) {
    id
    username
    tenantMembership {
      availability
      deactivation {
        reason
        details
        effectiveDate
        effectiveAt
      }
    }
  }
}
